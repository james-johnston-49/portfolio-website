<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mouse+Memoirs&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>James Johnston Portfolio - Contact</title>
  </head>
  <body>
    <header>
      <div class="title-row">
        <div class="branding">
          <img src="./logo.png" class="logo" />

          <div class="name">
            <h2>James</h2>
            <h2>Johnston</h2>
          </div>
        </div>

        <h1>Get In Touch!</h1>

        <div></div>
        <!-- empty right side -->
      </div>
    </header>

    <div class="nav-container">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Open navigation menu">
        <span></span>
      </label>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="goals.html">Goals</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>

    <div class="desktop-container">
      <main>
        <p class="contact-text">Feel free to send me a message!</p>
        <p class="contact-text">
          Reach out for inquiries via the form below, or my <a
            href="https://instagram.com/james.not.so.special"
            target="_blank"
            rel="noopener noreferrer"
            >Instagram</a
          >.
        </p>
        <form
          action="https://formspree.io/f/mlgknlea"
          class="contact-form"
          method="POST"
        >
          <div class="form-group">
            <label for="name"
              >Name
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                required
              />
            </label>
          </div>
          <div class="form-group">
            <label for="email"
              >Email
              <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
              />
            </label>
          </div>
          <div class="form-group">
            <label for="message"
              >Message
              <textarea
                id="message"
                name="message"
                rows="6"
                placeholder="Write a message..."
                required
              ></textarea>
            </label>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </main>
    </div>
    <div class="contact-images">
          <div class="image-1">
            <img src="./long-bug-1.png" alt="Frog Image" />
          </div>
          <div class="image-2">
            <img src="./long-bug-2.png" alt="Frog Image" />
          </div>
    </div>
    <footer>
      <p>&copy;2026 James Johnston. All rights reserved.</p>

      <div class="footer-links">
        <a
          href="https://instagram.com/james.not.so.special"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <a href="mailto:jaston2706@gmail.com?subject=Portfolio%20Enquiry">
          Email
        </a>
      </div>
    </footer>
  </body>
</html>
